<svg viewBox="0 0 140 280" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <radialGradient id="rl-glow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#FFD98A" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#E08A3C" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9F4826" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rl-brass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#F2CF7A"/>
      <stop offset="55%" stop-color="#A87A2C"/>
      <stop offset="100%" stop-color="#5A3414"/>
    </linearGradient>
    <linearGradient id="rl-brass-h" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#5A3414"/>
      <stop offset="50%" stop-color="#E8C078"/>
      <stop offset="100%" stop-color="#5A3414"/>
    </linearGradient>
    <linearGradient id="rl-ruby" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#FFB99A"/>
      <stop offset="55%" stop-color="#C2342B"/>
      <stop offset="100%" stop-color="#6B1410"/>
    </linearGradient>
    <linearGradient id="rl-amber" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#FFE0A0"/>
      <stop offset="55%" stop-color="#D88A2C"/>
      <stop offset="100%" stop-color="#7A3E0E"/>
    </linearGradient>
    <linearGradient id="rl-chain" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#5A3414" stop-opacity="0"/>
      <stop offset="100%" stop-color="#5A3414" stop-opacity="0.65"/>
    </linearGradient>
  </defs>

  <!-- Chain -->
  <line x1="70" y1="0" x2="70" y2="46" stroke="url(#rl-chain)" stroke-width="1.3"/>
  <g fill="#5A3414" opacity="0.6">
    <circle cx="70" cy="8"  r="2"/>
    <circle cx="70" cy="18" r="2"/>
    <circle cx="70" cy="28" r="2"/>
    <circle cx="70" cy="38" r="2"/>
  </g>

  <!-- Halo -->
  <ellipse cx="70" cy="160" rx="66" ry="80" fill="url(#rl-glow)" opacity="0.55"/>

  <!-- Top finial -->
  <path d="M60 48 Q70 36 80 48 L77 58 H63 Z" fill="url(#rl-brass)"/>
  <ellipse cx="70" cy="62" rx="14" ry="2.6" fill="url(#rl-brass-h)"/>

  <!-- Shoulder -->
  <path d="M40 66 Q70 58 100 66 L96 78 H44 Z" fill="url(#rl-brass)"/>

  <!-- Bulb body backplate -->
  <path d="M36 78 Q22 130 40 178 Q70 196 100 178 Q118 130 104 78 Z" fill="#3A1F0A" opacity="0.92"/>

  <!-- Stained glass arched windows (top row) -->
  <g stroke="url(#rl-brass)" stroke-width="1.8">
    <path d="M40 82 q9 -12 18 0 v30 h-18 z" fill="url(#rl-amber)"/>
    <path d="M61 82 q9 -12 18 0 v30 h-18 z" fill="url(#rl-ruby)"/>
    <path d="M82 82 q9 -12 18 0 v30 h-18 z" fill="url(#rl-amber)"/>
  </g>
  <!-- highlights -->
  <g fill="#FFE6A8" opacity="0.4">
    <path d="M44 86 q3 -5 6 0 v8 h-6 z"/>
    <path d="M65 86 q3 -5 6 0 v8 h-6 z"/>
    <path d="M86 86 q3 -5 6 0 v8 h-6 z"/>
  </g>

  <!-- Middle band -->
  <path d="M34 118 Q70 126 106 118 L104 126 Q70 134 36 126 Z" fill="url(#rl-brass-h)"/>

  <!-- Lower row — diamond panels -->
  <g stroke="url(#rl-brass)" stroke-width="1.6">
    <path d="M40 132 l12 -4 l12 4 l-12 36 z" fill="url(#rl-ruby)"/>
    <path d="M68 132 l12 -4 l12 4 l-12 36 z" fill="url(#rl-amber)"/>
    <path d="M94 132 l8 -4 l8 4 l-8 36 z" fill="url(#rl-ruby)"/>
  </g>

  <!-- Bottom dome -->
  <path d="M44 178 Q70 192 96 178 L90 196 Q70 204 50 196 Z" fill="url(#rl-brass)"/>

  <!-- Bottom finial -->
  <path d="M58 198 H82 L78 212 Q70 224 62 212 Z" fill="url(#rl-brass)"/>
  <circle cx="70" cy="232" r="3.5" fill="url(#rl-brass)"/>
  <path d="M68 236 Q70 250 72 236" stroke="#5A3414" stroke-width="0.9" fill="none"/>

  <!-- left highlight -->
  <path d="M40 84 Q26 130 42 174" stroke="#FFE6A8" stroke-width="1.2" opacity="0.4" fill="none"/>
</svg>
